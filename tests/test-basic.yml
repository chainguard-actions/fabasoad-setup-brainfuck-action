name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert brainfucky is installed
        run: |
          echo "Checking brainfucky installation..."
          pip3 show brainfucky
          if ! pip3 show brainfucky > /dev/null 2>&1; then
            echo "FAIL: brainfucky package is not installed"
            exit 1
          fi
          echo "PASS: brainfucky is installed"
      - name: Assert default version is installed
        run: |
          VERSION=$(pip3 show brainfucky | grep -i "^Version:" | awk '{print $2}')
          echo "actual version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not determine installed version"
            exit 1
          fi
          echo "PASS: brainfucky version $VERSION is installed"
      - name: Assert brainfucky module is importable
        run: |
          if ! python3 -c "import brainfucky" 2>/dev/null; then
            echo "FAIL: brainfucky module cannot be imported"
            exit 1
          fi
          echo "PASS: brainfucky module is importable"
