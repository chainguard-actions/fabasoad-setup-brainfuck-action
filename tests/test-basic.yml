name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert brainfucky is installed with default version
        run: |
          echo "Checking brainfucky installation..."
          if ! pip3 show brainfucky > /dev/null 2>&1; then
            echo "FAIL: brainfucky is not installed"
            exit 1
          fi
          INSTALLED_VERSION="$(pip3 show brainfucky | grep '^Version:' | awk '{print $2}')"
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "0.1.dev1" ]; then
            echo "FAIL: expected version '0.1.dev1' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS: brainfucky $INSTALLED_VERSION is installed"
      - name: Assert brainfucky command is available
        run: |
          echo "Checking brainfucky command..."
          if ! command -v brainfucky > /dev/null 2>&1; then
            echo "FAIL: brainfucky command not found in PATH"
            exit 1
          fi
          echo "PASS: brainfucky command is available at $(command -v brainfucky)"
