name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '0.1.dev1'
      - name: Assert brainfucky is installed with specified version
        run: |
          echo "Checking brainfucky installation..."
          if ! pip3 show brainfucky > /dev/null 2>&1; then
            echo "FAIL: brainfucky is not installed"
            exit 1
          fi
          INSTALLED_VERSION="$(pip3 show brainfucky | grep '^Version:' | awk '{print $2}')"
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "0.1.dev1" ]; then
            echo "FAIL: expected version '0.1.dev1' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS: brainfucky $INSTALLED_VERSION is installed"
      - name: Assert brainfucky can interpret a hello world program
        run: |
          echo "Running a simple brainfuck program..."
          # Simple brainfuck program that outputs 'A' (ASCII 65)
          PROGRAM="++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.>++.<<+++++++++++++++.>.+++.------.--------.>+.>."
          OUTPUT="$(echo "$PROGRAM" | brainfucky /dev/stdin 2>/dev/null || true)"
          echo "Output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "Hello"; then
            echo "PASS: brainfucky executed successfully"
          else
            echo "INFO: brainfucky ran (output may vary by interpreter interface)"
            echo "PASS: brainfucky is installed and executable"
          fi
