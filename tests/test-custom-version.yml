name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.1.dev1"
      - name: Assert brainfucky is installed with specified version
        run: |
          echo "Checking brainfucky installation with custom version..."
          if ! pip3 show brainfucky > /dev/null 2>&1; then
            echo "FAIL: brainfucky is not installed"
            exit 1
          fi
          INSTALLED_VERSION="$(pip3 show brainfucky | grep '^Version:' | awk '{print $2}')"
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "0.1.dev1" ]; then
            echo "FAIL: expected version '0.1.dev1' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS: brainfucky $INSTALLED_VERSION is installed"
      - name: Assert brainfucky command is usable
        run: |
          echo "Checking brainfucky is importable via Python..."
          if ! python3 -c "import brainfucky" > /dev/null 2>&1; then
            echo "FAIL: brainfucky Python module is not importable"
            exit 1
          fi
          echo "PASS: brainfucky module is importable"
